<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SECURAS｜公式サイト</title>
<link rel="stylesheet" href="styles.css">
<style>
body{margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
header nav{float:none;display:flex;flex-wrap:wrap;gap:4px}
header nav a{display:inline-block;padding:8px 9px;border-radius:6px;cursor:pointer}
header nav a.active,header nav a:hover{background:#173b57}
#page-content{min-height:55vh}
.loading-state{padding:70px 20px;text-align:center;color:#52677a}
@media(max-width:760px){header{align-items:flex-start;flex-direction:column}header nav{gap:2px}header nav a{margin:0;font-size:11px}}
</style>
</head>
<body>
<header>
<a href="index.html" id="brand-home" style="color:white;text-decoration:none"><b>SECURAS</b></a>
<nav aria-label="メインメニュー">
<a href="index.html" data-page="index.html">トップ</a>
<a href="about.html" data-page="about.html">会社概要</a>
<a href="business.html" data-page="business.html">事業内容</a>
<a href="history.html" data-page="history.html">歴史</a>
<a href="toyo.html" data-page="toyo.html">東陽市</a>
<a href="training.html" data-page="training.html">研修制度</a>
<a href="people.html" data-page="people.html">社員・組織</a>
<a href="recruit.html" data-page="recruit.html">採用情報</a>
<a href="news.html" data-page="news.html">お知らせ</a>
<a href="contact.html" data-page="contact.html">お問い合わせ</a>
<a href="https://discord.gg/m7aD3rVCu8" target="_blank" rel="noopener">公式Discord ↗</a>
</nav>
</header>
<main id="page-content"><div class="loading-state">SECURASを読み込み中…</div></main>
<footer><b>SECURAS INC.</b><p>セキュラス株式会社｜厳正・誠実・信頼</p><p>本サイトはRoblox内でのRP活動を目的とした非公式サイトです。</p></footer>
<a class="securas-edit-link" href="https://github.com/Oshun1019/-securas-website/edit/main/index.html" target="_blank" rel="noopener">✎ このページを編集</a>
<script>
(function(){
 const main=document.getElementById('page-content');
 const navLinks=[...document.querySelectorAll('[data-page]')];
 const titles={'index.html':'トップページ','about.html':'会社概要','business.html':'事業内容','history.html':'セキュラスの歴史','toyo.html':'東陽市','training.html':'研修制度','people.html':'社員・組織','recruit.html':'採用情報','news.html':'お知らせ','contact.html':'お問い合わせ'};
 let current='index.html';
 async function showPage(file){
  if(!titles[file]) file='index.html';
  current=file;
  main.innerHTML='<div class="loading-state">ページを読み込み中…</div>';
  navLinks.forEach(a=>a.classList.toggle('active',a.dataset.page===file));
  try{
   const response=await fetch(file,{cache:'no-store'});
   if(!response.ok) throw new Error('HTTP '+response.status);
   const html=await response.text();
   const doc=new DOMParser().parseFromString(html,'text/html');
   let nodes=[];
   if(file==='index.html'){
    const hero=doc.querySelector('.hero');
    const news=doc.querySelector('.news');
    if(hero) nodes.push(hero);
    if(news) nodes.push(news);
   }else{
    const heading=doc.querySelector('.page-heading');
    const section=doc.querySelector('main section, body > section, section.wrap, section.contact, section.city, section#'+file.replace('.html',''));
    if(heading) nodes.push(heading);
    if(section && !nodes.includes(section)) nodes.push(section);
    if(nodes.length<2){
      const bodySections=[...doc.body.children].filter(el=>el.tagName==='SECTION');
      bodySections.forEach(el=>{if(!nodes.includes(el)) nodes.push(el)});
    }
   }
   if(!nodes.length) throw new Error('ページ内容を見つけられませんでした');
   main.replaceChildren(...nodes.map(n=>document.importNode(n,true)));
   document.title=titles[file]+'｜SECURAS セキュラス株式会社';
   main.querySelectorAll('a[href]').forEach(a=>{
    const href=a.getAttribute('href');
    if(href && /^(index|about|business|history|toyo|training|people|recruit|news|contact)\.html(?:#.*)?$/.test(href)){
     a.addEventListener('click',e=>{e.preventDefault();showPage(href.split('#')[0]);window.scrollTo({top:0,behavior:'smooth'});});
    }
   });
   const edit=document.querySelector('.securas-edit-link');
   if(edit) edit.href='https://github.com/Oshun1019/-securas-website/edit/main/'+file;
   window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){
   main.innerHTML='<section class="wrap"><h2>ページを読み込めませんでした</h2><p>少し待ってから再読み込みしてください。</p><p><a href="'+file+'">このページを直接開く</a></p></section>';
  }
 }
 navLinks.forEach(a=>a.addEventListener('click',e=>{e.preventDefault();showPage(a.dataset.page)}));
 document.getElementById('brand-home').addEventListener('click',e=>{e.preventDefault();showPage('index.html')});
 showPage('index.html');
})();
</script>
</body>
</html>
